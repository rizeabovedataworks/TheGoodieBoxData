<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Goodie Box — Official App</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #FFF5EA;
            color: #333333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            max-width: 600px;
            background: #ffffff;
            border-radius: 16px;
            padding: 32px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(74, 46, 27, 0.08);
            border: 1px solid #EAE0D5;
        }
        .app-icon {
            width: 96px;
            height: 96px;
            border-radius: 20px;
            margin-bottom: 16px;
        }
        h1 {
            color: #4A2E1B;
            font-size: 28px;
            margin: 0 0 8px 0;
        }
        h2 {
            color: #A35C2A;
            font-size: 16px;
            font-weight: 600;
            margin: 0 0 20px 0;
        }
        p {
            color: #5D4037;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            background-color: #A35C2A;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn:hover {
            transform: translateY(-2dp);
            background-color: #8C4E22;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="app/src/main/res/drawable/ic_tgb_mainapp.png" alt="The Goodie Box Icon" class="app-icon">
        <h1>The Goodie Box</h1>
        <h2>Preserving Mom's Kitchen &amp; the Meals We Grew Up Loving</h2>
        <p>A digital family heirloom recipe chest designed to preserve cherished home recipes, family kitchen memories, and baking traditions across generations.</p>
        <a href="https://rizeabovedataworks.github.io/goodiebox.html" class="btn" target="_blank">Visit Official Website</a>
    </div>
</body>
</html>
