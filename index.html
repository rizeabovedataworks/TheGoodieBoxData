<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Goodie Box — Preserving Mom's Kitchen &amp; Family Recipes — RizeAbove DataWorks</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0A1A2F;
            color: #FFFFFF;
            text-align: center;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #11263F;
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(0, 200, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .app-icon {
            width: 120px;
            height: 120px;
            border-radius: 24px;
            margin-bottom: 20px;
        }
        h1 {
            color: #00E08A;
            font-size: 2.5rem;
            margin: 0 0 10px 0;
        }
        h2 {
            color: #00C8FF;
            font-size: 1.4rem;
            margin-bottom: 20px;
            font-weight: normal;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #D9D9D9;
        }
        .btn {
            display: inline-block;
            background-color: #00E08A;
            color: #0A1A2F;
            padding: 14px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            margin-top: 25px;
            transition: transform 0.2s ease;
        }
        .btn:hover {
            transform: translateY(-2dp);
            background-color: #00C8FF;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="app/src/main/res/drawable/ic_tgb_mainapp.png" alt="The Goodie Box Icon" class="app-icon">

        <a href="https://github.com/rizeabovedataworks/TheGoodieBox" class="btn" target="_blank">View GitHub Repository</a>
    </div>
